[project]
name = "mizani"
version = "0.1.0"
description = "Cited, auditable procurement briefs from Kenya OCDS award data"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Mizani contributors" }]
dependencies = [
    "duckdb>=1.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "typer>=0.12",
    "rich>=13.0",
    "mcp>=2.3.0",
    "langgraph>=1.2.15",
    "langchain-core>=1.6.10",
    "langchain-ollama>=1.1.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]


[project.scripts]
mizani = "mizani.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizani"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
